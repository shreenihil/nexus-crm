global:
  domain: "crm.example.com"
  environment: "production"

api:
  replicaCount: 2
  image:
    repository: nexus-crm/api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    limits:
      cpu: 1500m
      memory: 1536Mi
    requests:
      cpu: 250m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

web:
  replicaCount: 2
  image:
    repository: nexus-crm/web
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: crm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: nexus-tls-cert
      hosts:
        - crm.example.com

database:
  host: "postgres.database.svc.cluster.local"
  port: 5432
  name: "nexus_db"
  user: "nexus"
  existingSecret: "nexus-db-secret"
  secretKeyRef: "password"

redis:
  host: "redis.cache.svc.cluster.local"
  port: 6379

storage:
  s3:
    endpoint: "https://s3.amazonaws.com"
    region: "ap-south-1"
    bucket: "nexus-crm-attachments"
    existingSecret: "nexus-s3-secret"

security:
  cookieSecret: "change-this-in-production-min-32-chars-key"
  masterKeySeed: "change-this-in-production-master-kms-seed-32-bytes"

networkPolicy:
  enabled: true
