apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  COOKIE_SECRET: {{ .Values.security.cookieSecret | quote }}
  MASTER_KEY_SEED: {{ .Values.security.masterKeySeed | quote }}
