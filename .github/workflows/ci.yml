name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_crm
          POSTGRES_USER: nexus_app
          POSTGRES_PASSWORD: nexus_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78d470c02df07e9d792dbb4234033dc5f6 # v3.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Lint
        run: pnpm turbo lint

      - name: Run Unit & Integration Tests (Vitest)
        run: pnpm turbo test
        env:
          DATABASE_URL: postgres://nexus_app:nexus_password@localhost:5432/nexus_crm
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-secret-jwt-key-not-for-production
          SESSION_SECRET: ci-secret-session-key-32chars-min

      - name: Build All Apps and Packages
        run: pnpm turbo build
